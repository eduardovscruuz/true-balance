<div class="p-6 max-w-md">
  <h1 class="text-2xl font-bold text-gray-800 mb-6">{{ formRef()?.formTitle() ?? '' }}</h1>

  <app-transaction-form
    [transactionId]="transactionId"
    [initialType]="initialType"
    [initialSource]="initialSource"
    [initialCreditCardId]="initialCreditCardId"
    (saved)="onSaved()"
  />

  @if (formRef(); as form) {
    @if (form.isCreditCardMode() && !form.isEditMode()) {
      <div class="flex items-center justify-between pt-2">
        <a routerLink="/transactions" class="px-4 py-2 rounded-md bg-red-600 text-white hover:bg-red-700 transition">
          Cancelar
        </a>
        <div class="flex gap-2">
          <button
            type="button"
            (click)="form.onSubmit()"
            class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition"
          >
            Salvar
          </button>
          <button
            type="button"
            (click)="form.saveAndCreateAnother()"
            class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition"
          >
            Salvar e criar outro
          </button>
        </div>
      </div>
    } @else {
      <div class="flex items-center justify-between gap-2 pt-2">
        <div class="flex gap-2">
          <button
            type="button"
            (click)="form.onSubmit()"
            class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition"
          >
            Salvar
          </button>
          <a
            routerLink="/transactions"
            class="px-4 py-2 rounded-md border border-gray-300 text-gray-700 hover:bg-gray-50 transition"
          >
            Cancelar
          </a>
        </div>
        @if (form.isEditMode()) {
          <button
            type="button"
            (click)="form.deleteTransaction()"
            class="px-4 py-2 rounded-md border border-red-300 text-red-600 hover:bg-red-50 transition"
          >
            Excluir
          </button>
        }
      </div>
    }
  }
</div>

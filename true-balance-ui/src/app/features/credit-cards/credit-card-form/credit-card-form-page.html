<div class="p-6 max-w-md">
  <h1 class="text-2xl font-bold text-gray-800 mb-6">{{ formRef()?.formTitle() ?? '' }}</h1>

  <app-credit-card-form [creditCardId]="creditCardId" (saved)="onSaved()" />

  <div class="flex gap-2 pt-4">
    <button
      type="button"
      (click)="formRef()?.onSubmit()"
      class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition"
    >
      Salvar
    </button>
    <a
      routerLink="/credit-cards"
      class="px-4 py-2 rounded-md border border-gray-300 text-gray-700 hover:bg-gray-50 transition"
    >
      Cancelar
    </a>
  </div>
</div>

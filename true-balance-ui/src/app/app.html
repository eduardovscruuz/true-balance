<div class="h-screen flex flex-col">
  <nav class="bg-gray-900 text-white shrink-0">
  <div class="max-w-7xl mx-auto px-4 py-3 flex items-center gap-6">
    <div class="relative">
      <button
        type="button"
        (click)="toggleNewMenu()"
        class="w-9 h-9 flex items-center justify-center rounded-lg bg-white text-gray-800 border border-gray-300 hover:bg-gray-100 transition"
        aria-label="Novo lançamento"
      >
        <lucide-icon name="plus" [size]="18"></lucide-icon>
      </button>

      @if (newMenuOpen()) {
        <div class="fixed inset-0 z-40" (click)="closeNewMenu()"></div>
        <div class="absolute left-0 mt-2 w-44 bg-white rounded-lg shadow-lg py-1 z-50">
          <button
            type="button"
            (click)="transactionModal.openExpense(); closeNewMenu()"
            class="block w-full text-left px-4 py-2 text-sm font-semibold text-red-600 hover:bg-red-50 transition"
          >
            Despesa
          </button>
          <button
            type="button"
            (click)="transactionModal.openIncome(); closeNewMenu()"
            class="block w-full text-left px-4 py-2 text-sm font-semibold text-green-600 hover:bg-green-50 transition"
          >
            Receita
          </button>
          <button
            type="button"
            (click)="transactionModal.openCreditCard(); closeNewMenu()"
            class="block w-full text-left px-4 py-2 text-sm font-semibold text-gray-900 hover:bg-gray-100 transition"
          >
            Cartão
          </button>
          <button
            type="button"
            (click)="aiModal.openModal(); closeNewMenu()"
            class="block w-full text-left px-4 py-2 text-sm font-semibold text-blue-600 hover:bg-blue-50 transition"
          >
            IA
          </button>
        </div>
      }
    </div>

    <a
      routerLink="/"
      routerLinkActive="text-blue-400"
      [routerLinkActiveOptions]="{ exact: true }"
      class="hover:text-blue-300 transition"
    >
      Dashboard
    </a>
    <a routerLink="/transactions" routerLinkActive="text-blue-400" class="hover:text-blue-300 transition">
      Transações
    </a>
    <a routerLink="/categories" routerLinkActive="text-blue-400" class="hover:text-blue-300 transition">
      Categorias
    </a>
    <a routerLink="/accounts" routerLinkActive="text-blue-400" class="hover:text-blue-300 transition">
      Contas
    </a>
    <a routerLink="/credit-cards" routerLinkActive="text-blue-400" class="hover:text-blue-300 transition">
      Cartões
    </a>

    <div class="flex items-center gap-3 ml-auto">
      <div class="flex items-center gap-3 bg-gray-800 rounded-lg px-2 py-1">
        <button
          type="button"
          (click)="monthSelection.previousMonth()"
          [disabled]="!monthSelection.canGoPrevious()"
          class="w-8 h-8 flex items-center justify-center rounded hover:bg-gray-700 transition disabled:opacity-30 disabled:hover:bg-transparent disabled:cursor-not-allowed"
          aria-label="Mês anterior"
        >
          ‹
        </button>
        <span class="text-sm font-medium w-32 text-center capitalize">{{ monthSelection.selectedMonthLabel() }}</span>
        <button
          type="button"
          (click)="monthSelection.nextMonth()"
          [disabled]="!monthSelection.canGoNext()"
          class="w-8 h-8 flex items-center justify-center rounded hover:bg-gray-700 transition disabled:opacity-30 disabled:hover:bg-transparent disabled:cursor-not-allowed"
          aria-label="Próximo mês"
        >
          ›
        </button>
      </div>
    </div>
  </div>
  </nav>

  <div id="app-scroll-container" class="flex-1 overflow-y-auto">
    <main class="max-w-7xl mx-auto">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

@if (transactionModal.openRequest(); as request) {
  <app-transaction-form-modal
    [transactionId]="request.transactionId ?? null"
    [initialType]="request.type"
    [initialSource]="request.source ?? null"
    (closed)="transactionModal.close()"
  />
}

@if (aiModal.isOpen()) {
  <app-ai-transaction-entry-modal (closed)="aiModal.close()" />
}

@if (payInvoiceModal.request()) {
  <app-pay-invoice-modal />
}

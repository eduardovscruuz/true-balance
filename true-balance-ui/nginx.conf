server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://true-balance-api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sem isso, o navegador pode cachear o index.html sem revalidar — aí ele continua
    # apontando pro bundle JS antigo mesmo depois de um deploy novo, e as mudanças só
    # aparecem depois de um hard refresh manual (F5 normal não basta).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Bundles JS/CSS já têm hash no nome (ex: main-JARPBJMD.js) — um conteúdo novo sempre
    # gera um nome novo, então pode cachear "pra sempre" sem risco de servir algo velho.
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
